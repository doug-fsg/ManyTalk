tags:
  - Conversations
operationId: conversationMerge
description: Merge two conversations into one. Messages and related data from the mergee conversation are moved to the base conversation.
summary: Merge Conversations
security:
  - userApiKey: []
parameters:
  - $ref: '#/parameters/account_id'
  - name: data
    in: body
    required: true
    schema:
      type: object
      required:
        - base_conversation_id
        - mergee_conversation_id
      properties:
        base_conversation_id:
          type: integer
          description: Display ID of the conversation that will remain after the merge
        mergee_conversation_id:
          type: integer
          description: Display ID of the conversation that will be merged and removed
responses:
  200:
    description: Success
    schema:
      $ref: '#/definitions/conversation'
  401:
    description: Unauthorized
  422:
    description: Unprocessable Entity
    schema:
      $ref: '#/definitions/request_error'
